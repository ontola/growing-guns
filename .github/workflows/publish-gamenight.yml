name: Publish GameNight preview
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: gamenight-publish
  cancel-in-progress: false
jobs:
  upload:
    if: vars.GAMENIGHT_PUBLISH_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: gamenight
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: growing-guns-windows
          path: package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Upload the tested build
        uses: ontola/gamenight@a7cff20d0d8dadd21a578fb223101173533d27ff
        with:
          token: ${{ secrets.GAMENIGHT_API_TOKEN }}
          game: growing-guns
          file: package/MoreRounds.zip
          platform: windows
          entrypoint: MoreRounds.exe
          version: ci-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          channel: preview
      # Store data follows gamenight.json on every build (players, title,
      # tagline). Only the manual release workflow did this, so the store
      # still said 2-4 players after players.min went to 1.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source
          sparse-checkout: gamenight.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: ontola/gamenight
          ref: 581dfed420c088f25781ea545d8e921e5934380e
          path: publisher
          sparse-checkout: scripts/gamenight-publish.py
          sparse-checkout-cone-mode: false
      - name: Update the store listing from gamenight.json
        env:
          GAMENIGHT_API_TOKEN: ${{ secrets.GAMENIGHT_API_TOKEN }}
        run: python3 publisher/scripts/gamenight-publish.py store --manifest source/gamenight.json
